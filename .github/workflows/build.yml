name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alertapp-userscript
          path: dist/alertapp.user.js

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alertapp.user.js
          body: |
            ## alertapp ${{ github.ref_name }}

            Install: Tampermonkey → New script → paste below file content
            또는 `dist/alertapp.user.js` raw URL 클릭 (Tampermonkey 자동 install)
